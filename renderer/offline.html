<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kidzvidz — Offline</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; text-align: center;
      font-family: "Poppins", "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(1200px 500px at 50% -10%, #4f46e5 0%, transparent 60%), #0b1020;
      color: #fff; padding: 24px;
    }
    .logo { font-size: 40px; font-weight: 800; letter-spacing: -0.5px; }
    .logo span { color: #c7d2fe; }
    h1 { margin: 0; font-size: 22px; font-weight: 700; }
    p { margin: 0; max-width: 30rem; color: #c7cbe6; line-height: 1.6; }
    button {
      margin-top: 8px; border: 0; cursor: pointer;
      background: #2563eb; color: #fff; font-weight: 600; font-size: 15px;
      padding: 12px 22px; border-radius: 9999px; transition: filter .15s;
    }
    button:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <div class="logo">Kidz<span>vidz</span> 🎬</div>
  <h1>You&rsquo;re offline</h1>
  <p>We couldn&rsquo;t reach Kidzvidz. Check your internet connection and try again.</p>
  <button onclick="location.href='https://kidzvidz.uk'">Try again</button>
</body>
</html>
